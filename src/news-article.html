<!doctype html>
<html id="top" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>News Article | Parker Russell International</title>
    <meta
      name="description"
      content="News article template with rich text styles for Parker Russell International."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    {{> sprite}}
    <a class="skip-link visually-hidden" href="#main-content">
      Skip to content
    </a>
    {{> header}}
    <main id="main-content" tabindex="-1">
      {{> section-news-article}}
    </main>
    {{> footer}}
    <script type="module" src="/ts/main.ts"></script>
  </body>
</html>
